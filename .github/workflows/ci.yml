name: CI/CD Pipeline - PawCare AI (VKU Capstone)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-check:
    name: Clean Architecture, TypeCheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeCheck (TypeScript strict mode)
        run: npm run typecheck
      - name: Unit Tests (Domain & Data layer)
        run: npm test

  fastlane-check:
    name: Fastlane CI/CD Configuration Validation
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Verify Fastlane files
        run: |
          test -f fastlane/Fastfile && echo "Fastfile exists"
          test -f fastlane/Appfile && echo "Appfile exists"
          test -f eas.json && echo "eas.json exists"
